<!doctype html>
<!-- The source of adapter.jpg: a generic RJ12 6P6C plug to 6-screw
     terminal adapter, modelled in three.js. Dimensions in mm, approximate.
     Render: open in a WebGL browser and save the canvas, or headless with
     Chromium from the repository root, then scale it to 960 px:

       chromium --headless --use-angle=swiftshader --enable-unsafe-swiftshader \
         --allow-file-access-from-files --window-size=1920,1920 --virtual-time-budget=8000 \
         --screenshot=adapter.png "file://$PWD/docs/wiring/adapter.html?size=1920" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>RJ12 adapter render</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="three-r128/three.min.js"></script>
<script>
const SIZE = Number(new URLSearchParams(location.search).get('size') || 1200);
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// A studio for reflections: a soft grey room with large bright panels.
function studio() {
  const room = new THREE.Scene();
  const walls = new THREE.Mesh(new THREE.BoxGeometry(100, 60, 100),
    new THREE.MeshBasicMaterial({color: 0x161616, side: THREE.BackSide}));
  walls.position.y = 25;
  room.add(walls);
  const panel = (w, h, pos, look, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({color: new THREE.Color(k, k, k), side: THREE.DoubleSide}));
    m.position.set(...pos);
    m.lookAt(...look);
    room.add(m);
  };
  panel(60, 30, [0, 54, 0], [0, 0, 0], 1.2);       // overhead softbox
  panel(20, 40, [-48, 20, -20], [0, 10, 0], 1.0);  // left strip
  panel(20, 40, [48, 20, 10], [0, 10, 0], 0.5);  // right fill
  panel(40, 20, [0, 15, -48], [0, 10, 0], 0.6);    // front
  const pmrem = new THREE.PMREMGenerator(renderer);
  return pmrem.fromScene(room, 0.03).texture;
}
scene.environment = studio();

// Fine grain for moulded plastic.
function grain(seed, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size);
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < size * size; i++) {
    const v = 110 + rnd() * 60;
    img.data.set([v, v, v, 255], i * 4);
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const mat = {
  black: new THREE.MeshPhysicalMaterial({color: 0x0b0c0d, roughness: 0.6, envMapIntensity: 0.7, clearcoat: 0.15,
    clearcoatRoughness: 0.5, bumpMap: grain(7), bumpScale: 0.015}),
  green: new THREE.MeshPhysicalMaterial({color: 0x1c8436, roughness: 0.5, clearcoat: 0.2,
    clearcoatRoughness: 0.4, bumpMap: grain(11), bumpScale: 0.008}),
  well: new THREE.MeshStandardMaterial({color: 0x0f2d17, roughness: 0.9, side: THREE.BackSide}),
  hole: new THREE.MeshStandardMaterial({color: 0x050505, roughness: 1}),
  nickel: new THREE.MeshStandardMaterial({color: 0xd9dade, metalness: 1, roughness: 0.28}),
  brass: new THREE.MeshStandardMaterial({color: 0xd9b45c, metalness: 1, roughness: 0.3, envMapIntensity: 2}),
  gold: new THREE.MeshStandardMaterial({color: 0xffc94d, metalness: 1, roughness: 0.18, envMapIntensity: 3}),
  clear: new THREE.MeshPhysicalMaterial({color: 0xf4f7fb, roughness: 0.06, metalness: 0,
    clearcoat: 1, clearcoatRoughness: 0.04, transparent: true, opacity: 0.32,
    side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.6}),
};
for (const m of [mat.black, mat.green]) m.bumpMap.repeat.set(0.25, 0.25);

const adapter = new THREE.Group();
scene.add(adapter);
function add(geo, material, x = 0, y = 0, z = 0, group = adapter) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  group.add(m);
  return m;
}

function roundRect(w, h, r, cx = 0, cy = 0, path = new THREE.Shape()) {
  const x = cx - w / 2, y = cy - h / 2;
  path.moveTo(x + r, y);
  path.lineTo(x + w - r, y); path.quadraticCurveTo(x + w, y, x + w, y + r);
  path.lineTo(x + w, y + h - r); path.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  path.lineTo(x + r, y + h); path.quadraticCurveTo(x, y + h, x, y + h - r);
  path.lineTo(x, y + r); path.quadraticCurveTo(x, y, x + r, y);
  return path;
}

// A box with softened edges, centred in x and y, from z0 to z1.
function soft(w, h, z0, z1, bevel, holes = []) {
  const shape = roundRect(w - 2 * bevel, h - 2 * bevel, Math.min(0.6, (h - 2 * bevel) / 3));
  shape.holes.push(...holes);
  const g = new THREE.ExtrudeGeometry(shape, {depth: z1 - z0 - 2 * bevel, bevelEnabled: bevel > 0,
    bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 12});
  g.translate(0, 0, z0 + bevel);
  return g;
}

// A frustum between two centred rectangles: the housing's taper.
function taper(w0, h0, z0, w1, h1, z1, dy1 = 0) {
  const g = new THREE.BoxGeometry(1, 1, 1, 1, 1, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const back = p.getZ(i) > 0;
    p.setXYZ(i, p.getX(i) * (back ? w1 : w0), p.getY(i) * (back ? h1 : h0) + (back ? dy1 : 0),
      back ? z1 : z0);
  }
  g.computeVertexNormals();
  return g;
}

// --- The black housing: wide at the terminals, narrowing to the plug.
const HY = 6;                       // housing centre height
const housing = new THREE.Group();
housing.position.y = HY;
adapter.add(housing);
add(soft(27, 12.4, -0.6, 12, 0.9), mat.black, 0, 0, 0, housing);
add(taper(25.6, 11, 11.6, 14.6, 9.4, 19.4, 0.4), mat.black, 0, 0, 0, housing);
add(soft(15.6, 10.4, 18.8, 23, 0.8), mat.black, 0, 0.4, 0, housing);
// --- The RJ12 plug: clear polycarbonate, six gold blades at the tip.
const plug = new THREE.Group();
plug.position.set(0, HY + 0.9, 0);
adapter.add(plug);
const PZ0 = 22.6, PZ1 = 35.4;
const body = add(soft(9.6, 6.6, PZ0, PZ1, 0.45), mat.clear, 0, 0, 0, plug);
body.castShadow = false;
body.renderOrder = 2;
// Contact slots in the top at the tip, ribs between them.
for (let i = 0; i < 6; i++) {
  const x = (i - 2.5) * 1.02;
  add(new THREE.BoxGeometry(0.34, 1.5, 3.6), mat.gold, x, 2.55, PZ1 - 2.3, plug);
  // The conductor running back from each blade inside the body.
  const wire = add(new THREE.CylinderGeometry(0.16, 0.16, 8.5, 8), mat.brass, x, 1.4, PZ1 - 7.4, plug);
  wire.rotation.x = Math.PI / 2;
}
for (let i = 0; i < 7; i++) {
  const rib = add(new THREE.BoxGeometry(0.42, 0.35, 4.2), mat.clear, (i - 3) * 1.02, 3.35, PZ1 - 2.4, plug);
  rib.renderOrder = 3;
}
// The latch underneath, sprung from the tip.
const latch = new THREE.Group();
latch.position.set(0, -3.3, PZ1 - 1.4);
latch.rotation.x = -0.16;
plug.add(latch);
const tab = add(new THREE.BoxGeometry(6.2, 0.9, 10.5), mat.clear, 0, -0.5, -5.2, latch);
tab.renderOrder = 2;
// A strain relief where the cable would be crimped.
add(new THREE.BoxGeometry(7.4, 0.6, 2.2), mat.clear, 0, 3.6, PZ0 + 3, plug).renderOrder = 2;

// --- The green 6-way pluggable terminal block, 3.81 mm pitch.
const PITCH = 3.81, BW = 6 * PITCH + 0.8, BH = 9.2;
const block = new THREE.Group();
block.position.set(0, HY - BH / 2 - 0.6, 0);
adapter.add(block);
const F0 = -10.5, F1 = -6.4;        // front section with the wire entries
// Front: an XY profile with six square entries, extruded along z.
const entries = [];
for (let i = 0; i < 6; i++) {
  const p = new THREE.Path();
  const x = (i - 2.5) * PITCH, y = 2.9, s = 2.5;
  p.moveTo(x - s / 2, y - s / 2); p.lineTo(x - s / 2, y + s / 2);
  p.lineTo(x + s / 2, y + s / 2); p.lineTo(x + s / 2, y - s / 2); p.lineTo(x - s / 2, y - s / 2);
  entries.push(p);
}
const front = soft(BW, BH, F0, F1, 0.25, entries);
front.translate(0, BH / 2, 0);
add(front, mat.green, 0, 0, 0, block);
// Behind each entry: the dark cavity and the rising clamp.
const sleeve = new THREE.MeshStandardMaterial({color: 0x040805, roughness: 1, side: THREE.BackSide});
for (let i = 0; i < 6; i++) {
  const x = (i - 2.5) * PITCH;
  add(new THREE.BoxGeometry(2.5, 2.5, 0.1), mat.hole, x, 2.9, F1 - 0.04, block);
  add(new THREE.BoxGeometry(2.46, 2.46, F1 - F0 - 0.3), sleeve, x, 2.9, (F0 + F1) / 2 + 0.15, block);
  add(new THREE.BoxGeometry(2.3, 0.5, 2.6), mat.nickel, x, 3.85, F1 - 1.4, block);
  add(new THREE.BoxGeometry(2.3, 0.4, 2.6), mat.nickel, x, 1.9, F1 - 1.4, block);
}
// Rear lower body.
add(soft(BW, 6.4, F1 - 0.05, 0.6, 0.2), mat.green, 0, 3.2, 0, block);
// Top: an XZ plate with six screw wells.
const wells = [];
const WZ = -3.0;
for (let i = 0; i < 6; i++) {
  const p = new THREE.Path();
  p.absarc((i - 2.5) * PITCH, WZ, 1.45, 0, Math.PI * 2, true);
  wells.push(p);
}
// The shape is in (x, z): rotating it about x maps its y onto z.
const plate = new THREE.Shape();
plate.moveTo(-BW / 2, F1); plate.lineTo(BW / 2, F1); plate.lineTo(BW / 2, 0.4); plate.lineTo(-BW / 2, 0.4);
plate.lineTo(-BW / 2, F1);
plate.holes.push(...wells);
const topGeo = new THREE.ExtrudeGeometry(plate, {depth: 2.8, bevelEnabled: true, bevelThickness: 0.2,
  bevelSize: 0.2, bevelSegments: 3, curveSegments: 32});
topGeo.rotateX(Math.PI / 2);       // shape y -> z, extrusion -> -y
topGeo.translate(0, BH - 0.2, 0);
add(topGeo, mat.green, 0, 0, 0, block);
// Inside each well: a dark wall, and a nickel screw with its slot.
for (let i = 0; i < 6; i++) {
  const x = (i - 2.5) * PITCH;
  add(new THREE.CylinderGeometry(1.42, 1.42, 2.9, 32, 1, true), mat.well, x, BH - 1.6, WZ, block);
  add(new THREE.CylinderGeometry(1.3, 1.3, 0.7, 40), mat.nickel, x, BH - 1.75, WZ, block);
  add(new THREE.SphereGeometry(1.3, 40, 12, 0, Math.PI * 2, 0, 0.45), mat.nickel, x, BH - 2.5, WZ, block);
  const slot = add(new THREE.BoxGeometry(2.4, 0.5, 0.38), mat.hole, x, BH - 1.25, WZ, block);
  slot.rotation.y = 0.35 + i * 0.47;
}
// Separators on the top between positions, and the polarising step.
for (let i = 1; i < 6; i++) {
  add(new THREE.BoxGeometry(0.55, 0.5, 2.0), mat.green, (i - 3) * PITCH, BH + 0.2, F1 + 0.9, block);
}
add(new THREE.BoxGeometry(BW - 0.4, 0.9, 0.9), mat.green, 0, BH - 0.3, F1 + 0.1, block);

// --- Ground, light and camera.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({opacity: 0.16}));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(-30, 80, -40);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, {left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200});
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.4);
rim.position.set(40, 30, 60);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdddddd, 0.15));

// Lean the adapter so the plug points up and to the right, as in a product shot.
adapter.rotation.set(-0.26, -0.22, 0, 'YXZ');
adapter.position.set(0, 2.6, -4);

// Frame the adapter: look at its centre from above, front and left.
const camera = new THREE.PerspectiveCamera(22, 1, 1, 1000);
adapter.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(adapter);
const centre = box.getCenter(new THREE.Vector3());
const radius = box.getBoundingSphere(new THREE.Sphere()).radius;
const view = new THREE.Vector3(-0.62, 0.78, -0.9).normalize();
camera.position.copy(centre).addScaledVector(view, radius / Math.sin(THREE.MathUtils.degToRad(22) / 2) * 0.86);
camera.lookAt(centre);
renderer.render(scene, camera);
document.title = 'rendered';
</script>
</body>
</html>
